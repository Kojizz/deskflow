server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 256k;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  location /api/ { proxy_pass http://api:8080; proxy_set_header Host $host; }
  location /hooks/ { proxy_pass http://api:8080; proxy_set_header Host $host; }
  location /forms/ { proxy_pass http://api:8080; proxy_set_header Host $host; }
  location /swagger-ui/ { proxy_pass http://api:8080; }
  location /v3/api-docs { proxy_pass http://api:8080; }
  location / { try_files $uri $uri/ /index.html; }
}
